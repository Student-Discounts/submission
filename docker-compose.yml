name: submission-service
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: submission
      POSTGRES_USER: ${SD_SUBMISSION_DB_USER:-submission}
      POSTGRES_PASSWORD: ${SD_SUBMISSION_DB_PASSWORD:-submission}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - submission-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: c3VibWlzc2lvbi1sb2NhbA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - '127.0.0.1:9092:9092'
    volumes:
      - submission-kafka:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s
  stubs:
    image: wiremock/wiremock:3.13.1
    command: ['--global-response-templating', '--disable-banner']
    ports:
      - '127.0.0.1:8090:8080'
    volumes:
      - ./dev/stubs:/home/wiremock:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:8080/__admin/health >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: ['app']
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8081
      SD_SUBMISSION_DB_URL: jdbc:postgresql://postgres:5432/submission
      SD_SUBMISSION_DB_USER: ${SD_SUBMISSION_DB_USER:-submission}
      SD_SUBMISSION_DB_PASSWORD: ${SD_SUBMISSION_DB_PASSWORD:-submission}
      SD_SUBMISSION_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SD_SUBMISSION_AUTH_ISSUER: ${SD_SUBMISSION_AUTH_ISSUER:-http://localhost:8080}
      SD_SUBMISSION_AUTH_JWK_SET_URI: ${SD_SUBMISSION_AUTH_JWK_SET_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      SD_SUBMISSION_CATALOG_BASE_URL: http://stubs:8080
      SD_SUBMISSION_MEDIA_BASE_URL: http://stubs:8080
      SD_SUBMISSION_GEO_BASE_URL: http://stubs:8080
      SD_SUBMISSION_ORGANIZATIONS_BASE_URL: http://stubs:8080
      SD_SUBMISSION_CORS_ALLOWED_ORIGINS: ${SD_SUBMISSION_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      stubs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081;
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r line <&3;
          [[ "$$line" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  submission-postgres:
  submission-kafka:
